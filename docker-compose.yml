
x-app-env: &app_env
  NODE_ENV: production
  PORT: "3000"
  WORKERS_ENABLED: "true"
  WORKER_OUTBOX_INTERVAL_MS: "400"
  WORKER_INBOX_INTERVAL_MS: "400"
  WORKER_INBOUND_INTERVAL_MS: "400"
  WORKER_PENDING_INTERVAL_MS: "300"
  PENDING_REFERENCE_BATCH_SIZE: "10"
  PENDING_REFERENCE_LEASE_SECONDS: "15"
  OUTBOX_CLAIM_LEASE_SECONDS: ${OUTBOX_CLAIM_LEASE_SECONDS:-60}
  SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-10000}
  # Probe C3 (0 em prod): hold ininterrupto para forçar drain_timeout em teste
  SHUTDOWN_TEST_HOLD_MS: ${SHUTDOWN_TEST_HOLD_MS:-0}
  DATABASE_HOST: postgres

  DATABASE_PORT: "5432"
  DATABASE_USER: ${DATABASE_USER}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD}
  DATABASE_NAME: ${DATABASE_NAME}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_MAIN_QUEUE_URL: http://localstack:4566/000000000000/jungle-wager-events
  SQS_DLQ_URL: http://localstack:4566/000000000000/jungle-wager-events-dlq
  SQS_INBOUND_QUEUE_URL: http://localstack:4566/000000000000/jungle-wager-transactions.fifo
  SQS_INBOUND_DLQ_URL: http://localstack:4566/000000000000/jungle-wager-transactions-dlq.fifo
  SQS_VISIBILITY_TIMEOUT_SECONDS: ${SQS_VISIBILITY_TIMEOUT_SECONDS:-30}
  SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
  SQS_RECEIVE_WAIT_SECONDS: "1"
  SQS_RECEIVE_MAX_MESSAGES: "10"
  OUTBOX_PUBLISHER_BATCH_SIZE: "10"

services:
  postgres:
    image: postgres:16
    container_name: jungle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8
    container_name: jungle-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEBUG: "0"
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: oven/bun:1.4.4
    working_dir: /app
    volumes:
      - .:/app
    network_mode: "service:postgres"
    environment:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
    entrypoint: ["bun", "./src/infrastructure/database/migration-cli.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["migrate"]

  # Fase B/C — três processos independentes (mesma imagem, mesmo PG e SQS)
  app-1: &app
    build:
      context: .
      dockerfile: Dockerfile
    image: jungle-wagering-app:local
    restart: unless-stopped
    # >= SHUTDOWN_DRAIN_MS para Nest drenar ticks antes do SIGKILL do Docker
    stop_grace_period: 15s
    stop_signal: SIGTERM
    environment:
      <<: *app_env
      INSTANCE_ID: app-1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "3001:3000"

  app-2:
    <<: *app
    ports:
      - "3002:3000"
    environment:
      <<: *app_env
      INSTANCE_ID: app-2

  app-3:
    <<: *app
    ports:
      - "3003:3000"
    environment:
      <<: *app_env
      INSTANCE_ID: app-3

  # Fase D — Prometheus (scraping app-1..3; sem Grafana nesta fase)
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: jungle-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app-1
      - app-2
      - app-3

volumes:
  postgres_data:
  localstack_data:
  prometheus_data:
