# Prometheus — scrape das três instâncias do Distributed Wagering Processor.
# Cada target expõe /metrics no processo (counters por instância; gauges PG/SQS cacheados).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dwp-apps
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - app-1:3000
        labels:
          instance_name: app-1
      - targets:
          - app-2:3000
        labels:
          instance_name: app-2
      - targets:
          - app-3:3000
        labels:
          instance_name: app-3
